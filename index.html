<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parcel Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--text:#1a1a18;--text2:#6b6b65;--text3:#9b9b93;--accent:#1a6b3c;--accent-bg:#e6f4ec;--accent-light:#d0ebdb;--danger:#c0392b;--danger-bg:#fdf0ef;--warn:#b8860b;--warn-bg:#fdf6e3;--radius:12px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.tb-brand{display:flex;align-items:center;gap:8px;padding:13px 0;flex:1}
.tb-icon{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.tb-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-title{font-size:15px;font-weight:600}
.main{max-width:600px;margin:0 auto;padding:1.25rem}
.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.field-sm label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field-sm input{width:100%;padding:10px 12px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.field-sm input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,107,60,.1)}
.field-sm input.mono{font-family:'DM Mono',monospace}
.btn-submit{width:100%;padding:12px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;margin-top:10px;transition:opacity .15s}
.btn-submit:hover{opacity:.9}.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.form-toast{margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;display:none}
.form-toast.ok{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-light);display:block}
.form-toast.err{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(192,57,43,.15);display:block}
.empty{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:1}.main{padding:1rem}.topbar{padding:0 1rem}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-brand">
    <div class="tb-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div>
    <div class="tb-title">Parcel Portal</div>
  </div>
</div>
<div class="main">
  <div class="section-title" style="margin-bottom:10px">Submit a parcel</div>
  <div class="form-card">
    <div class="form-grid">
      <div class="field-sm full"><label>Your Name</label><input type="text" id="f-submitter" placeholder="e.g. Rahul" autocomplete="off"/></div>
      <div class="field-sm full"><label>Name of Parcel</label><input type="text" id="f-name" placeholder="e.g. PS5, Nike Shoes" autocomplete="off"/></div>
      <div class="field-sm full"><label>Tracking ID</label><input type="text" id="f-tracking" class="mono" placeholder="FMPP4011928937" autocomplete="off" spellcheck="false"/></div>
      <div class="field-sm full"><label>OTP</label><input type="text" id="f-otp" class="mono" placeholder="603028" inputmode="numeric" maxlength="6"/></div>
      <div class="field-sm full"><label>Last 4 Digits <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text3)">(paste full number, we'll extract)</span></label>
        <input type="text" id="f-last4" placeholder="Paste full number or last 4 digits" inputmode="numeric" oninput="extractLast4(this)" onpaste="setTimeout(()=>extractLast4(this),0)"/>
      </div>
      <div class="field-sm full"><label>Product Name</label><input type="text" id="f-product" placeholder="e.g. PS5, Nike Shoes" autocomplete="off"/></div>
    </div>
    <button class="btn-submit" onclick="submitParcel()" id="submit-btn">Submit Parcel</button>
    <div class="form-toast" id="f-toast"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAWKEUcFGgEn20Uqc3pkHxzDuewO_FOW8w",
  authDomain: "parcel-otp.firebaseapp.com",
  projectId: "parcel-otp",
  storageBucket: "parcel-otp.firebasestorage.app",
  messagingSenderId: "998007579858",
  appId: "1:998007579858:web:35aad5031846f00f95390b"
});
var db = firebase.firestore();

// Remember submitter name
try { var saved = localStorage.getItem('submitter_name'); if(saved) document.getElementById('f-submitter').value = saved; } catch(e){}

function extractLast4(el) {
  var digits = el.value.replace(/[^0-9]/g, '');
  el.value = digits.slice(-4);
}

async function submitParcel() {
  var submitterName = document.getElementById('f-submitter').value.trim();
  var parcelName    = document.getElementById('f-name').value.trim();
  var tracking      = document.getElementById('f-tracking').value.trim().toUpperCase();
  var otp           = document.getElementById('f-otp').value.trim();
  var last4         = document.getElementById('f-last4').value.replace(/[^0-9]/g,'').slice(-4);
  var product       = document.getElementById('f-product').value.trim();
  var toastEl       = document.getElementById('f-toast');
  toastEl.className = 'form-toast';

  if (!submitterName) { toastEl.className='form-toast err'; toastEl.textContent='Please enter your name.'; return; }
  if (!tracking)      { toastEl.className='form-toast err'; toastEl.textContent='Tracking ID is required.'; return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Checking…';

  // Duplicate check
  try {
    var dup = await db.collection('parcels').where('tracking','==',tracking).get();
    if (!dup.empty) {
      toastEl.className = 'form-toast err';
      toastEl.textContent = '⚠️ This tracking ID was already submitted. Contact admin if this is wrong.';
      btn.disabled = false; btn.textContent = 'Submit Parcel';
      return;
    }
  } catch(e) {}

  btn.textContent = 'Submitting…';
  try { localStorage.setItem('submitter_name', submitterName); } catch(e) {}

  try {
    await db.collection('parcels').add({
      parcelName: parcelName||'—', tracking: tracking,
      otp: otp||'—', last4: last4||'—', product: product||'—',
      userId: 'user', userName: submitterName,
      delivered: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    ['f-name','f-tracking','f-otp','f-last4','f-product'].forEach(function(id){ document.getElementById(id).value=''; });
    toastEl.className = 'form-toast ok';
    toastEl.textContent = '✓ Parcel submitted successfully!';
    setTimeout(function(){ toastEl.className='form-toast'; }, 3000);
  } catch(e) {
    toastEl.className = 'form-toast err';
    toastEl.textContent = 'Error submitting. Please try again.';
  }
  btn.disabled = false; btn.textContent = 'Submit Parcel';
}
</script>
</body>
</html>
