<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parcel Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--text:#1a1a18;--text2:#6b6b65;--text3:#9b9b93;--accent:#1a6b3c;--accent-bg:#e6f4ec;--accent-light:#d0ebdb;--danger:#c0392b;--danger-bg:#fdf0ef;--warn:#b8860b;--warn-bg:#fdf6e3;--radius:12px;--radius-sm:8px;--shadow:0 2px 8px rgba(0,0,0,0.08),0 8px 24px rgba(0,0,0,0.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.tb-brand{display:flex;align-items:center;gap:8px;padding:13px 0;flex:1}
.tb-icon{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.tb-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-title{font-size:15px;font-weight:600}

.main{max-width:600px;margin:0 auto;padding:1.25rem}
.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.field-sm label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field-sm input{width:100%;padding:10px 12px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.field-sm input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,107,60,.1)}
.field-sm input.mono{font-family:'DM Mono',monospace}

.btn-submit{width:100%;padding:12px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;margin-top:10px;transition:opacity .15s,transform .1s}
.btn-submit:hover{opacity:.9}.btn-submit:active{transform:scale(.98)}.btn-submit:disabled{opacity:.5;cursor:not-allowed}

.form-toast{margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;display:none}
.form-toast.ok{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-light);display:block}
.form-toast.err{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(192,57,43,.15);display:block}

.parcel-list{display:flex;flex-direction:column;gap:8px}
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.p-card.delivered{opacity:.55}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.p-name{font-size:14px;font-weight:600}
.p-product{font-size:13px;color:var(--text2);margin-top:2px}
.otp-box{text-align:right;flex-shrink:0}
.otp-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.otp-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--accent);background:var(--accent-bg);padding:4px 10px;border-radius:var(--radius-sm);letter-spacing:2px;margin-top:2px;display:inline-block}
.otp-pending{font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-bg);padding:5px 10px;border-radius:var(--radius-sm);border:1px solid rgba(184,134,11,.2);margin-top:2px;display:inline-block}
.p-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);align-items:center}
.meta{font-size:12px;color:var(--text3)}
.meta strong{color:var(--text2);font-weight:500}
.delivered-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent);display:inline-flex;align-items:center;gap:3px;margin-left:auto}
.delivered-badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3)}
.empty svg{width:36px;height:36px;margin:0 auto 10px;display:block;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round}
.empty p{font-size:13px}
.loading{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
.field-sm input.otp-part{width:100%;padding:10px 12px;font-size:18px;letter-spacing:4px;text-align:center}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:1}.main{padding:1rem}.topbar{padding:0 1rem}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand">
    <div class="tb-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div>
    <div class="tb-title">Parcel Portal</div>
  </div>
</div>

<div class="main">
  <div class="section-title" style="margin-bottom:10px">Submit a parcel</div>

  <!-- SMART PASTE -->
  <div style="background:var(--surface);border:1.5px dashed var(--accent-light);border-radius:var(--radius);padding:1rem;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><circle cx="19" cy="5" r="3" fill="var(--accent)" stroke="none"/></svg>
      <span style="font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px">Smart Paste</span>
      <span style="font-size:11px;color:var(--text3);margin-left:2px">— paste any WhatsApp message, AI fills the form</span>
    </div>
    <div style="display:flex;gap:8px">
      <textarea id="smart-paste-input" rows="3" style="flex:1;padding:10px 12px;font-size:13px;font-family:'DM Mono',monospace;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);resize:none;outline:none;line-height:1.6" placeholder="Paste your WhatsApp OTP message here…"></textarea>
      <button onclick="smartParse()" id="smart-btn" style="padding:0 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:.15s">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Parse
      </button>
    </div>
    <div id="smart-status" style="font-size:12px;margin-top:6px;display:none"></div>
  </div>

  <div class="form-card">
    <div class="form-grid">
      <div class="field-sm full">
        <label>Your Name</label>
        <input type="text" id="f-submitter" placeholder="e.g. Rahul" autocomplete="off"/>
      </div>
      <div class="field-sm full">
        <label>Name of Parcel</label>
        <input type="text" id="f-name" placeholder="e.g. PS5, Nike Shoes" autocomplete="off"/>
      </div>
      <div class="field-sm full">
        <label>Tracking ID</label>
        <input type="text" id="f-tracking" class="mono" placeholder="FMPP4011928937" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field-sm full">
        <label>OTP</label>
        <input type="text" id="f-otp" class="mono" placeholder="603028" inputmode="numeric" maxlength="6"/>
      </div>
      <div class="field-sm full">
        <label>Last 4 Digits <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text3)">(paste full number, last 4 auto-extracted)</span></label>
        <input type="text" id="f-last4" placeholder="Paste full number or last 4 digits" inputmode="numeric" oninput="extractLast4(this)" onpaste="setTimeout(()=>extractLast4(this),0)"/>
      </div>
      <div class="field-sm full">
        <label>Product Name</label>
        <input type="text" id="f-product" placeholder="e.g. PS5, Nike Shoes" autocomplete="off"/>
      </div>
    </div>
    <button class="btn-submit" onclick="submitParcel()" id="submit-btn">Submit Parcel</button>
    <div class="form-toast" id="f-toast"></div>
  </div>


</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWKEUcFGgEn20Uqc3pkHxzDuewO_FOW8w",
  authDomain: "parcel-otp.firebaseapp.com",
  projectId: "parcel-otp",
  storageBucket: "parcel-otp.firebasestorage.app",
  messagingSenderId: "998007579858",
  appId: "1:998007579858:web:35aad5031846f00f95390b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Remember submitter name
try{
  const saved = localStorage.getItem('submitter_name');
  if(saved) document.getElementById('f-submitter').value = saved;
}catch(e){}


window.smartParse = async function(){
  const raw = document.getElementById('smart-paste-input').value.trim();
  const statusEl = document.getElementById('smart-status');
  const btn = document.getElementById('smart-btn');
  if(!raw){ statusEl.style.display='block'; statusEl.style.color='var(--danger)'; statusEl.textContent='Please paste a message first.'; return; }

  btn.disabled=true; btn.textContent='Parsing…';
  statusEl.style.display='block'; statusEl.style.color='var(--text3)'; statusEl.textContent='AI is reading your message…';

  try{
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:300,
        messages:[{role:"user",content:`Extract parcel details from this WhatsApp message and return ONLY a JSON object with these fields: submitterName, parcelName, tracking, otp, last4, product. If a field is not found return "". For last4 extract only the last 4 digits of any phone/mobile number found. Message:

${raw}`}]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text||'';
    const clean = text.replace(/\`\`\`json|\`\`\`/g,'').trim();
    const parsed = JSON.parse(clean);

    if(parsed.submitterName) document.getElementById('f-submitter').value = parsed.submitterName;
    if(parsed.parcelName) document.getElementById('f-name').value = parsed.parcelName;
    if(parsed.tracking) document.getElementById('f-tracking').value = parsed.tracking;
    if(parsed.otp) document.getElementById('f-otp').value = parsed.otp;
    if(parsed.last4){ const d=parsed.last4.replace(/[^0-9]/g,''); document.getElementById('f-last4').value=d.slice(-4); }
    if(parsed.product) document.getElementById('f-product').value = parsed.product;

    document.getElementById('smart-paste-input').value='';
    statusEl.style.color='var(--accent)'; statusEl.textContent='✓ Fields filled! Please review before submitting.';
  }catch(e){
    statusEl.style.color='var(--danger)'; statusEl.textContent='Could not parse. Please fill fields manually.';
  }
  btn.disabled=false; btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Parse';
}

window.submitParcel = async function(){
  const submitterName = document.getElementById('f-submitter').value.trim();
  const parcelName  = document.getElementById('f-name').value.trim();
  const tracking      = document.getElementById('f-tracking').value.trim();
  const otp           = document.getElementById('f-otp').value.trim();
  const last4         = document.getElementById('f-last4').value.trim();
  const product       = document.getElementById('f-product').value.trim();
  const toastEl       = document.getElementById('f-toast');
  toastEl.className   = 'form-toast';

  if(!submitterName){ toastEl.className='form-toast err'; toastEl.textContent='Please enter your name.'; return; }
  if(!tracking){ toastEl.className='form-toast err'; toastEl.textContent='Tracking ID is required.'; return; }

  try{ localStorage.setItem('submitter_name', submitterName); }catch(e){}

  const btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Submitting…';
  try{
    await addDoc(collection(db,'parcels'),{
      parcelName: parcelName||'—', tracking,
      otp: otp||'—', last4: last4||'—', product: product||'—',
      userId: 'user', userName: submitterName,
      delivered: false, createdAt: serverTimestamp()
    });
    ['f-name','f-tracking','f-otp','f-last4','f-product'].forEach(id=>document.getElementById(id).value='');
    toastEl.className='form-toast ok';
    toastEl.textContent='✓ Parcel submitted!';
    setTimeout(()=>toastEl.className='form-toast', 3000);
  }catch(e){
    toastEl.className='form-toast err';
    toastEl.textContent='Error submitting. Please try again.';
  }
  btn.disabled=false; btn.textContent='Submit Parcel';
}
</script>
</body>
</html>
