<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parcel Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f2;
  --bg2: #eeecea;
  --surface: #ffffff;
  --surface2: #f3f2ee;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #1c1b18;
  --text2: #6a6860;
  --text3: #a8a69e;
  --accent: #2d6a4f;
  --accent2: #40916c;
  --accent-bg: #d8f3dc;
  --accent-light: #b7e4c7;
  --danger: #c1440e;
  --danger-bg: #fdf0eb;
  --warn: #b45309;
  --warn-bg: #fef3c7;
  --radius: 14px;
  --radius-sm: 9px;
  --radius-xs: 6px;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 6px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.1);
}
[data-theme="dark"] {
  --bg: #121210;
  --bg2: #1a1917;
  --surface: #1e1d1b;
  --surface2: #252420;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0ede8;
  --text2: #9b9890;
  --text3: #615f58;
  --accent: #52b788;
  --accent2: #74c69d;
  --accent-bg: #1a3d2b;
  --accent-light: #2d6a4f;
  --danger: #f4845f;
  --danger-bg: #2d1810;
  --warn: #fcd34d;
  --warn-bg: #2d2008;
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 6px rgba(0,0,0,0.2), 0 12px 32px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; transition: background .3s, color .3s; }

/* TOPBAR */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.tb-left { display: flex; align-items: center; gap: 10px; padding: 14px 0; flex: 1; }
.tb-logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(45,106,79,.3);
}
.tb-logo svg { width: 17px; height: 17px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-title { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
.tb-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

.theme-btn {
  width: 36px; height: 36px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: .2s;
  flex-shrink: 0;
}
.theme-btn:hover { background: var(--bg2); }
.theme-btn svg { width: 16px; height: 16px; stroke: var(--text2); fill: none; stroke-width: 2; stroke-linecap: round; }

/* MAIN */
.main { max-width: 560px; margin: 0 auto; padding: 1.5rem; }

.page-header { margin-bottom: 1.5rem; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.page-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

/* FORM */
.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
}

.field { margin-bottom: 14px; }
.field:last-of-type { margin-bottom: 0; }
.field label {
  display: block;
  font-size: 11px; font-weight: 600;
  color: var(--text3);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 11px 14px;
  font-size: 14px;
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.field input:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(45,106,79,.12);
}
.field input::placeholder { color: var(--text3); }
.field input.mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .5px; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.field-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

.divider { height: 1px; background: var(--border); margin: 16px 0; }

.btn-submit {
  width: 100%;
  padding: 13px;
  font-size: 14px; font-weight: 600;
  font-family: 'Sora', sans-serif;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: opacity .15s, transform .1s, box-shadow .15s;
  box-shadow: 0 2px 8px rgba(45,106,79,.25);
  margin-top: 16px;
  letter-spacing: -.1px;
}
.btn-submit:hover { opacity: .92; box-shadow: 0 4px 14px rgba(45,106,79,.35); }
.btn-submit:active { transform: scale(.98); }
.btn-submit:disabled { opacity: .5; cursor: not-allowed; }

.toast {
  margin-top: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  display: none;
  align-items: center; gap: 8px;
}
.toast.ok { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-light); display: flex; }
.toast.err { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(193,68,14,.2); display: flex; }

@media(max-width:480px) { .main { padding: 1rem; } .field-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <div class="tb-logo">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    </div>
    <div>
      <div class="tb-title">Parcel Portal</div>
      <div class="tb-sub">Submit your delivery details</div>
    </div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">
    <svg id="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<div class="main">
  <div class="page-header">
    <div class="page-title">Submit a Parcel</div>
    <div class="page-sub">Fill in the delivery details below</div>
  </div>

  <div class="form-card">
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="f-submitter" placeholder="e.g. Rahul" autocomplete="off"/>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Name of Parcel</label>
      <input type="text" id="f-name" placeholder="e.g. PS5, Nike Shoes" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Tracking ID</label>
      <input type="text" id="f-tracking" class="mono" placeholder="FMPP4011928937" autocomplete="off" spellcheck="false"/>
    </div>
    <div class="field-row">
      <div class="field" style="margin-bottom:0">
        <label>OTP</label>
        <input type="text" id="f-otp" class="mono" placeholder="603028" inputmode="numeric" maxlength="6"/>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Last 4 Digits</label>
        <input type="text" id="f-last4" placeholder="Paste full number" inputmode="numeric" oninput="extractLast4(this)" onpaste="setTimeout(()=>extractLast4(this),0)"/>
        <div class="field-hint" id="last4-hint"></div>
      </div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>Product Name</label>
      <input type="text" id="f-product" placeholder="e.g. PS5, Nike Shoes" autocomplete="off"/>
    </div>

    <button class="btn-submit" onclick="submitParcel()" id="submit-btn">Submit Parcel</button>
    <div class="toast" id="f-toast"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAWKEUcFGgEn20Uqc3pkHxzDuewO_FOW8w",
  authDomain: "parcel-otp.firebaseapp.com",
  projectId: "parcel-otp",
  storageBucket: "parcel-otp.firebasestorage.app",
  messagingSenderId: "998007579858",
  appId: "1:998007579858:web:35aad5031846f00f95390b"
});
var db = firebase.firestore();

// Theme
var theme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', theme);
updateThemeIcon();

function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  updateThemeIcon();
}
function updateThemeIcon() {
  var icon = document.getElementById('theme-icon');
  if (theme === 'dark') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}

// Restore name
try { var s = localStorage.getItem('submitter_name'); if(s) document.getElementById('f-submitter').value = s; } catch(e) {}

function extractLast4(el) {
  var digits = el.value.replace(/[^0-9]/g, '');
  el.value = digits.slice(-4);
  var hint = document.getElementById('last4-hint');
  if (hint) hint.textContent = el.value.length === 4 ? '✓ Last 4: ' + el.value : '';
}

async function submitParcel() {
  var submitterName = document.getElementById('f-submitter').value.trim();
  var parcelName    = document.getElementById('f-name').value.trim();
  var tracking      = document.getElementById('f-tracking').value.trim().toUpperCase();
  var otp           = document.getElementById('f-otp').value.trim();
  var last4         = document.getElementById('f-last4').value.replace(/[^0-9]/g,'').slice(-4);
  var product       = document.getElementById('f-product').value.trim();
  var toastEl       = document.getElementById('f-toast');
  toastEl.className = 'toast';

  if (!submitterName) { showToast('err', 'Please enter your name.'); return; }
  if (!tracking)      { showToast('err', 'Tracking ID is required.'); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Checking…';

  try {
    var dup = await db.collection('parcels').where('tracking','==',tracking).get();
    if (!dup.empty) {
      showToast('err', '⚠️ This tracking ID was already submitted.');
      btn.disabled = false; btn.textContent = 'Submit Parcel'; return;
    }
  } catch(e) {}

  btn.textContent = 'Submitting…';
  try { localStorage.setItem('submitter_name', submitterName); } catch(e) {}

  try {
    await db.collection('parcels').add({
      parcelName: parcelName||'—', tracking: tracking,
      otp: otp||'—', last4: last4||'—', product: product||'—',
      userId: 'user', userName: submitterName,
      delivered: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    ['f-name','f-tracking','f-otp','f-last4','f-product'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('last4-hint').textContent = '';
    showToast('ok', '✓ Parcel submitted successfully!');
    setTimeout(function(){ document.getElementById('f-toast').className='toast'; }, 4000);
  } catch(e) {
    showToast('err', 'Error submitting. Please try again.');
  }
  btn.disabled = false; btn.textContent = 'Submit Parcel';
}

function showToast(type, msg) {
  var el = document.getElementById('f-toast');
  el.className = 'toast ' + type;
  el.textContent = msg;
}
</script>
</body>
</html>
